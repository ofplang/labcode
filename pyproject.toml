[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "labcode"
description = "labcode -- a dialect wrapper over the Object-Flow Programming Language toolchain"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazunari Kaizu", email = "kwaizu@gmail.com" }]
keywords = ["ofplang", "labcode", "dataflow", "workflow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
# labcode bundles the toolchain by depending on the ofplang sibling packages. `lc run`
# is the labcode dialect backend, so the floors reflect what it needs: run must bound how
# long one operation may run (`SubprocessBackend(op_timeout=...)`), which is what the
# lab-wide `x-labcode.op_timeout` is carried by (>=0.1.12, and which also takes a
# *transporter* out of the plan when `down_devices` reports one, from 0.1.11); the
# environment document and `max_ticks` this CLI now hands the runner (>=0.1.13, which is
# also where a tick stopped implying a replan); and **>=0.2.0**, which is where the runner
# takes `ignore_resources` and hands the scheduler's warnings back on `RunResult` -- `lc run`
# passes the first and prints the second, so an older run raises `TypeError` on the way in
# and silently drops the warnings on the way out. validate's `$import` expansion API so the
# front door hands the expanded document on (>=0.1.3). `validate` and `schedule`
# subcommands still forward unchanged.
#
# `ofplang-run>=0.3.0` is required: `lc run` executes refills, which needs the runner's
# `dispatch_replenishment` seam and the `kind: replenishment` the child harness has to
# recognise as side-effect only.
#
# `ofplang-schedule>=0.2.3` says what this package is tested against rather than what its
# own code calls -- nothing here calls a scheduler API newer than the in-memory workflow
# acceptance of 0.1.3. CI resolves the siblings from PyPI, so every run of this suite and
# every real-lab example already happens on it, and run's own floor requires it anyway
# (an older scheduler reports a running refill free before it is).
dependencies = [
# Upper bounds are deliberate. A sibling's minor version is where a
# specification revision lands, and a revision may reject documents an earlier one
# accepted: the 0.1 revision removed transform kinds and an output mode and renamed
# a process marker. Without a cap, an already-published release of this package
# would pick up the next such sibling and start refusing its own examples. The
# bounds cannot protect what is already on PyPI without one, which is why they go
# in now rather than at the first breakage.
    "ofplang-validate>=0.2,<0.3",
    "ofplang-schedule>=0.3,<0.4",
    "ofplang-run>=0.4,<0.5",
]

[project.urls]
Homepage = "https://github.com/ofplang/labcode"
Repository = "https://github.com/ofplang/labcode"

[project.optional-dependencies]
# The OpenTelemetry SDK is in `test` and `dev` rather than only in `otel`, for two reasons
# that are easy to get wrong. The tests assert the *shape* of what a run records, and a
# skipped test asserts nothing -- so CI has to be able to run them. And mypy is configured
# with `ignore_missing_imports`, which quietly turns an absent SDK's types into `Any`: that
# is how two real type errors in `labcode/otel.py` survived until the SDK was installed.
# The gRPC instrumentation is here for the first of those reasons, and it is asked for
# *with* its own `instruments` extra -- meaning `grpcio` -- because what the tests check is
# that a server-streaming call is passed through untouched, and there is no interceptor to
# hand a call to without the library it intercepts.
test = [
    "pytest>=7.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-grpc[instruments]>=0.41b0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.16",
    "mypy>=1.11",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-grpc[instruments]>=0.41b0",
]
# Only the SiLA2 integration example needs a SiLA2 client, and it needs it in whatever
# interpreter runs the scripts: labcode launches each one with `sys.executable`. It is an
# extra rather than a dependency because labcode itself never speaks SiLA2 -- an environment
# script does, and only if its author wrote one that does.
sila2 = ["sila2>=0.14"]
# Recording a run (`lc run --trace`) is optional, and needs the SDK in whichever interpreter
# drives the run -- which is also the one running the scripts, since labcode launches each
# with `sys.executable`. The floors are what the code actually touches: span kinds,
# `use_span(end_on_exit=...)`, W3C context propagation, and a batch processor with its own
# schedule delay. All of that was already in 1.20, verified by running the tests against it.
# The exporter is constructed with no arguments at all, so it asks for nothing newer; it is
# the HTTP one deliberately, so that nothing here constrains the `grpcio` that `sila2`
# brings into the same process.
# The gRPC instrumentation is what puts each RPC under the connection or the command that
# issued it -- the feature definitions a connection fetches, and a command's real round
# trip. It brings no `grpcio` of its own (its floor on one is an extra), which is right
# here: the `grpcio` in this process is whichever one `sila2` brought. The `filter_` this
# relies on has been there since `0.34b0`; `0.41b0` is simply the oldest release checked
# against the floors above, and it accepts `opentelemetry-api ~= 1.12`, so asking for it
# does not pull them upwards.
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-grpc>=0.41b0",
]

[project.scripts]
# The labcode command. Subcommands (`lc validate|schedule|run`) forward to the
# ofplang sibling packages' own CLIs.
lc = "labcode.cli:main"

# Version is derived from git tags (e.g. `v0.0.1`) by setuptools-scm. Until the
# first tag exists, fall back to a static placeholder so a source/editable tree
# still builds and reports a version.
[tool.setuptools_scm]
fallback_version = "0.0.0"

# labcode is an ordinary top-level package (it has an __init__.py); this
# distribution provides only the `labcode` package.
[tool.setuptools.packages.find]
include = ["labcode*"]

# Ship the PEP 561 marker so downstreams see this package as typed.
[tool.setuptools.package-data]
"labcode" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]

[tool.mypy]
python_version = "3.10"
# `examples/` is checked too: the scripts are the documented way to drive a labcode
# run, so a type error there is a claim about the API that no longer holds.
files = ["labcode", "examples"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# `render_plate_line.py` draws its chart with the scheduler's visualizer, which
# reaches ortools and so numpy, whose stubs use 3.12-only syntax that fails to parse
# under python_version 3.10. Don't follow into either -- the same override the
# ofplang-schedule and ofplang-run repos carry.
[[tool.mypy.overrides]]
module = ["numpy.*", "ortools.*"]
follow_imports = "skip"
