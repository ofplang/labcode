# A workflow with one Object-bearing transport: `source` creates a Sample, `target`
# consumes it, joined by one arc -- so the scheduler inserts a transport that labcode
# runs from the environment's x-labcode.script (transport.env.yaml).
spec_version: "0.0"

types:
  Sample:
    domain: object

processes:

  source:
    kind: atomic
    outputs:
      source_out: { type: Sample, phase: data }
    objects:
      create: [outputs.source_out]

  target:
    kind: atomic
    inputs:
      target_in: { type: Sample, phase: data }
    objects:
      consume: [inputs.target_in]

  main:
    kind: composite
    inputs: {}
    outputs: {}
    body:
      nodes:
        - id: SampleSource
          process: source
        - id: SampleTarget
          process: target
          state:
            target_in:
              from: SampleSource.source_out
      returns: {}

entry: main
