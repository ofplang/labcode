# Environment for device_script.workflow.yaml. `measure` carries its code as an
# `x-labcode.script` on its mode (labcode's (2)): the value it produces is computed by
# this env script, run out-of-process by the labcode backend. Device-less (like a v0
# §22 script process); the scheduler still needs one device to exist, so a rack is
# declared (the script never touches it).
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  measure:
    modes:
      - id: v0
        duration: 3
        x-labcode:
          script:
            language: python
            code: |
              return {"od": 0.42}
