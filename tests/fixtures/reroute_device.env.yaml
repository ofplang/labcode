# Environment for transport.workflow.yaml where `target` can run in two places, so an
# unreachable device can be routed around (probe -> down_devices -> re-route).
#
# station_1 is the cheap destination (carry 1, then target 2) and station_2 costs 4 to
# reach, so the plan prefers station_1 while it is reachable -- and where the Sample ends up
# says which one was used. Every process is scriptless (a typed-default no-op), so the run
# starts no child processes and needs no lab; reachability is whatever the prober says.
#
# The makespan is deliberately not asserted on: a test paces the wall clock at a
# millisecond per tick, and at that pace the virtual clock tracks how long the solver took
# rather than the durations below.
#
# Probing is enabled per machine (only the ones with an address), which keeps the plain
# holding device out of it -- the pattern SPECIFICATIONS.md §1.5 calls for.
time:
  unit: second

devices:
  - id: station_0
    spots: [core]
  - id: station_1
    spots: [core]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50101, insecure: true }
      probe: { enabled: true, interval: 0 }
  - id: station_2
    spots: [core]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50102, insecure: true }
      probe: { enabled: true, interval: 0 }

transporters:
  - { id: transport }

transports:
  - { transporter: transport, from: station_0.core, to: station_1.core, duration: 1 }
  - { transporter: transport, from: station_0.core, to: station_2.core, duration: 4 }

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core
      - devices: [station_2]
        duration: 2
        input_spots:
          target_in: station_2.core

objective:
  kind: makespan
