# Environment for transport.workflow.yaml. The station_0 -> station_1 route carries an
# x-labcode.script: labcode runs it (out-of-process) when the Sample is moved. It is
# side-effect only -- it just references its locals (the physical route + the moved
# Object's view). `source` / `target` are scriptless (typed-default no-op devices).
time:
  unit: second

devices:
  - { id: station_0, spots: [core] }
  - { id: station_1, spots: [core] }
transporters:
  - { id: transport }

transports:
  - transporter: transport
    from: station_0.core
    to: station_1.core
    duration: 1
    x-labcode:
      script:
        language: python
        code: |
          moved = (view, from_spot, to_spot, transporter)

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core
