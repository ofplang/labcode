# Environment for transport.workflow.yaml where each destination is reached by its own arm,
# so an unreachable *transporter* can be routed around (needs ofplang-run >= 0.1.11, where
# a down transporter's transports are dropped whatever the down scope).
#
# arm_a is the only way to station_1 and arm_b the only way to station_2, so where the
# Sample ends up says which arm was usable. Both stations can run `target`, and neither is
# probed -- only the arms are, which is what isolates transporter availability here.
#
# Every process is scriptless (a typed-default no-op), so the run starts no child processes
# and needs no lab; reachability is whatever the injected prober says.
time:
  unit: second

devices:
  - id: station_0
    spots: [core]
  - id: station_1
    spots: [core]
  - id: station_2
    spots: [core]

transporters:
  - id: arm_a
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50111, insecure: true }
      probe: { enabled: true, interval: 0 }
  - id: arm_b
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50112, insecure: true }
      probe: { enabled: true, interval: 0 }

transports:
  - { transporter: arm_a, from: station_0.core, to: station_1.core, duration: 1 }
  - { transporter: arm_b, from: station_0.core, to: station_2.core, duration: 4 }

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core
      - devices: [station_2]
        duration: 2
        input_spots:
          target_in: station_2.core
