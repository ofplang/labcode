# Environment for device_script.workflow.yaml with a stock the run must top up.
#
# `rack` holds a `reagent` it can never have more than 1 of, and `measure` draws that
# 1 each time it runs. The run starts with nothing (the boundary says so), so nothing
# can be measured until the `dispenser` has been.
#
# The refill's procedure is on the (replenisher, device) route, exactly as a
# transport's is on its (transporter, from, to) route: the pair is what has a
# procedure, while the machine has only an address. Here it stands in for real work
# with a sleep -- in real seconds, because a script is given what it needs to do the
# work and not the plan's tick count (the tick is the scheduler's estimate, not an
# instruction).
time:
  unit: second

devices:
  - id: rack
    spots: [slot]
    resources:
      reagent: { capacity: 1 }
transporters:
  - { id: arm }
transports: []

replenishers:
  - { id: dispenser }

replenishments:
  - replenisher: dispenser
    device: rack
    duration: 2
    x-labcode:
      script:
        language: python
        code: |
          import time
          time.sleep(0.01)

processes:

  measure:
    modes:
      - id: v0
        duration: 3
        devices: [rack]
        consumption: { rack.reagent: 1 }
        x-labcode:
          script:
            language: python
            code: |
              return {"od": 0.42}
