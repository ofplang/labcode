# The laboratory shared_bench.workflow.yaml runs in, with labcode's `x-labcode` scripts
# saying how each step is carried out.
#
# Deliberately narrow in the middle. The rack has **a slot per job**, so two jobs each
# have somewhere of their own to start and finish -- but there is **one reader and one
# arm**, so the two jobs have to take turns on both. That contention is the subject: a
# joint plan is worth making exactly where the work competes for something.
#
#   rack.slot_a ─┐                     ┌─ rack.slot_a
#                ├─ arm ─▶ reader.stage ┤
#   rack.slot_b ─┘                     └─ rack.slot_b
#
# The scripts are mocks (they return values and reference their locals). Replace a
# script's body with real device calls to drive real hardware -- that is the only thing
# that changes between this example and a bench.
time:
  unit: second

devices:
  # A tube rack: a plain holding location, used by no process. A slot per job, so the
  # two jobs' material never contends for a place to be -- only for the reader.
  - { id: rack,   spots: [slot_a, slot_b] }
  # The bench reader: one stage, so one tube at a time.
  - { id: reader, spots: [stage] }

transporters:
  # One arm, so the moves take turns too.
  - { id: arm }

transports:
  - transporter: arm
    from: rack.slot_a
    to: reader.stage
    duration: 2
    x-labcode:
      script:
        language: python
        code: |
          # `view` is the moved Tube's view (its label and labcode's `_id`); the move is
          # side-effect only, so nothing is returned.
          label = (view or {}).get("label")

  - transporter: arm
    from: rack.slot_b
    to: reader.stage
    duration: 2
    x-labcode:
      script:
        language: python
        code: |
          label = (view or {}).get("label")

  - transporter: arm
    from: reader.stage
    to: rack.slot_a
    duration: 2
    x-labcode:
      script:
        language: python
        code: |
          label = (view or {}).get("label")

  - transporter: arm
    from: reader.stage
    to: rack.slot_b
    duration: 2
    x-labcode:
      script:
        language: python
        code: |
          label = (view or {}).get("label")

processes:

  measure:
    modes:
      - devices: [reader]
        # Long next to the two-second moves, so the reader is what the jobs queue for.
        duration: 6
        input_spots:  { sample: reader.stage }
        output_spots: { measured: reader.stage }   # measured in place
        x-labcode:
          script:
            language: python
            code: |
              # `sample` is the incoming Tube's view; it is carried through automatically
              # (objects.map), so the script returns only what it computes -- labcode's
              # partial outputs (SPECIFICATIONS.md §1.2). The reading is derived from the
              # label so the two jobs' results differ, as two real tubes' would.
              label = (sample or {}).get("label") or ""
              return {"od": round(0.1 * len(label), 3)}
