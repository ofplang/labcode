# The labcode environment for sila2_plate_cycle.workflow.yaml, written with `flavor: sila2`
# -- the recommended way to drive a SiLA2 lab (SPECIFICATIONS.md §1.6). Each machine's
# address is declared once, under its `x-labcode.connection`, and each script is the
# commands alone: labcode opens `sila2_client` before the code runs and closes it afterwards.
#
# VERIFIED AGAINST: ofplang-sila2-backend v0.3.0 (commit 0c3c4c8), the virtual lab of mock
# SiLA2 instrument servers. That lab is a reference, not a requirement: pointing these
# scripts at real instruments is a matter of changing the hosts and ports below. The command
# arguments come from the delivery scripts in `ScriptsForIntegrationTest` (snip_xpeel.py,
# snip_plateloc.py, snip_atc.py, snip_microplate_centrifuge.py), so what each instrument is
# asked to do here is what those scripts ask of the real hardware.
#
# ---------------------------------------------------------------------------------------
# WHY THE DEVICE IDS DO NOT MATCH THE LAB'S LOCATION NAMES
#
# v0 identifiers are `[A-Za-z_][A-Za-z0-9_]*` (schedule SPECIFICATIONS §8), so a device id
# cannot contain a hyphen -- but the lab's locations are `seal-remover.stage` and
# `thermal-cycler.block`. The environment therefore names those devices `seal_remover` and
# `thermal_cycler`. The lab is not renamed to suit labcode: the dependency runs one way, and
# the lab's world model is not labcode's to edit.
#
# So each transport script **writes the lab's two location strings out literally** rather than
# passing `from_spot` / `to_spot` through. A route is one fixed pair of spots, so there is
# nothing to compute, and the name the lab actually receives is the name written here -- which
# is greppable, and does not pretend that `_` -> `-` is a rule (it is a coincidence of this
# lab's naming; a real lab may have a device legitimately called `foo_bar`).
#
# The cost of writing them out is that the route above and the strings below can drift apart:
# change a `from:` or `to:` and the script has to change with it. The lab is what catches that
# -- a move to a name it does not know fails with `unknown_location`, and one to the wrong
# real location fails when the plate turns out not to be where the next step needs it.
#
# Only transport scripts face this at all, because only they name spots: a process script is
# told nothing about where its Object sits, so all four instruments are driven the same way
# whether or not their names contain a hyphen.
#
# ---------------------------------------------------------------------------------------
# WHY THE LID AND DOOR CHOREOGRAPHY LIVES IN THE PROCESS SCRIPTS
#
# In the lab's world model a closed lid or door makes that spot inaccessible, and an item
# cannot be moved into or out of an inaccessible spot. The natural place to open the thermal
# cycler before the plate arrives would be the transport that delivers it -- but a transport
# script is given a client for its **transporter only**, not for the devices at either end of
# the route, so it cannot issue `OpenLid` at all.
#
# So each process script instead does close -> operate -> open, leaving the instrument open
# on the way in and on the way out. This works because a spot's `accessible` defaults to true
# and the lab's seed closes nothing, so everything is open at t=0, and because every script
# here reopens what it closed.
#
# 🔴 The limit of that: a run that dies between `CloseLid` and `OpenLid` leaves the spot
# closed, and the *next* run's transport into that instrument fails with `location_locked`.
# Reseeding the lab restores it. This is a workaround for labcode not giving a transport the
# clients it needs, not the intended shape -- when transports can reach the devices they move
# between, the open/close calls belong in the transports.
#
# ---------------------------------------------------------------------------------------
# WHAT THE DURATIONS ARE, AND WHY THEY ARE NOT THE INSTRUMENT'S TIME
#
# A mode's `duration` is what the *scheduler* should expect the operation to take, and an
# operation is more than the instrument's part of it. Measured against the lab's
# `command_durations.realistic.yaml` at `--seconds-per-tick 1.0`, each op costs roughly
#
#     (the profile's command times)  +  ~2-3 s  +  ~1 s per settle
#
# where the fixed part is labcode's own per-op cost -- launching the child process and
# building the SiLA2 client, which fetches every Feature definition -- and the per-settle part
# is the poll interval (1 s), since a command that finishes mid-interval is not noticed until
# the next look. `thermal_cycle` pays the most because all six of its commands are short
# (1+1+4+2+2+4 s), so each one loses most of a poll.
#
# So the numbers below are the *measured* op times, and each mode says where its figure comes
# from. Declaring the instrument's time alone would under-run every op by that overhead, and
# the scheduler would keep trying to dispatch a successor onto a device still finishing.
#
# The transports keep a nominal 3 against a measured 2: Pick/Place have no duration of their
# own in the profile, so a move is almost all overhead, and over-declaring is the safe
# direction. Against the lab's default profile (which waits for nothing) every op simply
# finishes early, and the run still completes -- so this environment works against both.
time:
  unit: second

devices:
  # The seal remover. The lab calls it `seal-remover`; see the note above on the renaming.
  - id: seal_remover
    spots: [stage]
    x-labcode:
      # `insecure: true` is currently required: TLS has nowhere in the schema to keep its
      # credentials, so it is refused at the front door (SPECIFICATIONS.md §1.4).
      connection: { kind: sila2, host: 127.0.0.1, port: 50054, insecure: true }

  # The plate sealer.
  - id: plateloc
    spots: [stage]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50053, insecure: true }

  # The thermal cycler. The lab calls it `thermal-cycler`.
  - id: thermal_cycler
    spots: [block]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50055, insecure: true }

  # The centrifuge.
  - id: centrifuge
    spots: [deck]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50052, insecure: true }

  # A station slot: a plain holding location, used by no process and driven by no script, so
  # it declares no connection. The Plate lives here at the run boundary, and the circuit
  # starts and ends here.
  - { id: station, spots: [slot1] }

transporters:
  # The arm carries the plate between all five locations. A transport script's client comes
  # from the transporter, not from the spots it moves between -- which is exactly the
  # limitation described above.
  - id: arm
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50057, insecure: true }

transports:
  # The lab's realistic profile gives Pick/Place no duration of their own (transport time
  # belongs to a later milestone), so 3 is a nominal figure throughout; every move finishes
  # early against both profiles.

  - transporter: arm
    from: station.slot1
    to: seal_remover.stage
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # `sila2_client` is connected to `arm`; from_spot / to_spot / transporter are the
          # physical route and `view` is the moved Plate's view. Side-effect only.
          #
          # A transfer is two commands, not one: Pick takes the plate onto the arm and Place
          # puts it down. Both are unobservable, so they have completed by the time the call
          # returns and there is nothing to poll.
          #
          # The locations are the lab's own names, written out (see the header): this route is
          # labcode's station.slot1 -> seal_remover.stage, and the lab calls the destination
          # `seal-remover.stage`.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier="station.slot1")
          arm.Place(LocationSpecifier="seal-remover.stage")

  - transporter: arm
    from: seal_remover.stage
    to: plateloc.stage
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # labcode's seal_remover.stage -> plateloc.stage.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier="seal-remover.stage")
          arm.Place(LocationSpecifier="plateloc.stage")

  - transporter: arm
    from: plateloc.stage
    to: thermal_cycler.block
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # labcode's plateloc.stage -> thermal_cycler.block.
          #
          # The thermal cycler's lid is open here -- it starts open and `thermal_cycle`
          # reopens it -- so this move needs no bracketing command. It could not issue one
          # anyway: this script's only client is the arm.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier="plateloc.stage")
          arm.Place(LocationSpecifier="thermal-cycler.block")

  - transporter: arm
    from: thermal_cycler.block
    to: centrifuge.deck
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # labcode's thermal_cycler.block -> centrifuge.deck.
          #
          # Same on both ends: the cycler's lid was reopened by `thermal_cycle` and the
          # centrifuge's door is open until `rotate` closes it.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier="thermal-cycler.block")
          arm.Place(LocationSpecifier="centrifuge.deck")

  - transporter: arm
    from: centrifuge.deck
    to: station.slot1
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # labcode's centrifuge.deck -> station.slot1: the closing leg, so the Plate ends
          # where it started and the run can be repeated without an operator putting the
          # world back.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier="centrifuge.deck")
          arm.Place(LocationSpecifier="station.slot1")

processes:

  peel:
    modes:
      - devices: [seal_remover]
        # Peel 8 + GetTapeLeft 0, plus ~2 settles' worth of poll and the per-op overhead.
        duration: 12
        input_spots:  { plate: seal_remover.stage }
        output_spots: { plate: seal_remover.stage }   # unsealed in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # `sila2_client` is connected to `seal_remover` -- the mode's only device.
              # `plate` is the incoming Plate's view; the Plate itself is carried through by
              # objects.map, so this script returns only what it reads (§1.2).
              #
              # Peel is an OBSERVABLE command: the call returns a command instance
              # immediately and the work happens on the server, so polling it to completion
              # is not optional. `settle` is that polling loop, shipped by labcode (§1.6.1)
              # and reached by an ordinary import: the flavor injects connections and nothing
              # else, so what this script depends on is written in it.
              #
              # Arguments are the delivery script's: snip_xpeel.py calls `Peel(4, 1)`
              # -- begin at the default location peeling slowly, with the shortest adhesion
              # time.
              from labcode.sila2_commands import settle

              feature = sila2_client.AutomatedPlateSealRemoverController
              # Peel needs a plate present at this server's location; if the transport before
              # it did not actually deliver one, this is where that surfaces.
              settle(feature.Peel(BeginPeelLocation=4, AdhesionTime=1), "Peel")
              tape = settle(feature.GetTapeLeft(), "GetTapeLeft")

              return {"tape_left": int(tape.SupplySpoolRemaining)}

  seal:
    modes:
      - devices: [plateloc]
        # SetSealingTemperature and SetSealingTime wait for nothing; StartCycle is 15 s.
        # One settle only, so this is the mode whose figure is closest to the instrument's.
        duration: 18
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # The sealing parameters are set on the instrument first and the cycle then runs
              # on whatever plate is present, which is why this reads as three calls rather
              # than one. 150 °C and 3 s are the delivery script's values
              # (snip_plateloc.py); both are unobservable commands, so neither is polled.
              #
              # CycleCount is a property, not a command: reading it needs no polling. It is
              # read after the cycle so the number reflects the one this run performed.
              #
              # Note which calls are settled and which are not: SetSealingTemperature and
              # SetSealingTime are UNOBSERVABLE, so they have finished when they return and
              # settling one would be an error (`sila2_not_observable`).
              from labcode.sila2_commands import settle

              feature = sila2_client.PlateLocController
              feature.SetSealingTemperature(SealingTemperature=150)
              feature.SetSealingTime(SealingTime=3.0)
              settle(feature.StartCycle(), "StartCycle")
              cycles = feature.CycleCount.get()

              return {"cycle_count": int(cycles)}

  thermal_cycle:
    modes:
      - devices: [thermal_cycler]
        # Load 1 + Validate 1 + CloseLid 4 + StartRun 2 + StopRun 2 + OpenLid 4 = 14 s of
        # instrument time, but six settles of six short commands: the poll dominates here.
        duration: 22
        input_spots:  { plate: thermal_cycler.block }
        output_spots: { plate: thermal_cycler.block }   # cycled in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # The whole lid choreography is here rather than in the transports, for the
              # reason given at the top of this file: a transport script has no client for the
              # device it is delivering to. Closing and reopening in one script also means the
              # instrument is left as it was found.
              #
              # The instrument rejects StartRun unless a protocol was loaded and validated, so
              # both precede it. `MaxSampleVolume=0` is the delivery script's value
              # (snip_atc.py calls `Validate(0)`); the Feature defines 0 as "use the
              # instrument's default".
              #
              # StartRun returns while the instrument keeps running -- per the Feature
              # contract the status stays Running until StopRun -- so StopRun is what actually
              # ends the run. ElapsedTime is read after it, which is when the instrument
              # reports how long the run took; before StopRun it is still zero.
              from labcode.sila2_commands import settle

              feature = sila2_client.AutomatedThermalCyclerController
              # A real protocol file would be read from disk here; the delivery script loads
              # ATCTestProtocol.xml. What matters to the workflow is that a protocol is loaded
              # and validated before the run, not what is in it.
              settle(feature.Load(ProtocolFileData=b"mock protocol"), "Load")
              settle(feature.Validate(MaxSampleVolume=0.0), "Validate")

              settle(feature.CloseLid(), "CloseLid")
              settle(feature.StartRun(), "StartRun")
              settle(feature.StopRun(), "StopRun")
              elapsed = feature.ElapsedTime.get()
              # Reopened before returning, so the plate can be picked back out.
              settle(feature.OpenLid(), "OpenLid")

              return {"elapsed_time": str(elapsed)}

  rotate:
    modes:
      - devices: [centrifuge]
        # CloseDoor 3 + SpinCycle 20 + OpenDoor 3, plus three settles and the per-op cost.
        duration: 30
        input_spots:  { plate: centrifuge.deck }
        output_spots: { plate: centrifuge.deck }   # spun in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # The same door choreography as the thermal cycler's lid, and for the same
              # reason: open to load, closed to spin, open again so the plate can be taken out.
              #
              # SpinCycle's fifteen arguments are the delivery script's
              # (snip_microplate_centrifuge.py): 20 % velocity/acceleration/deceleration,
              # TimerMode 0 (the Time below is the total, including ramp-up and ramp-down),
              # 30 seconds, bucket 1 for both load and unload, and the default gripper
              # offsets, plate heights, speeds and options.
              #
              # The centrifuge exposes no counter or measurement, so this script returns
              # nothing -- the Plate is carried through by objects.map.
              from labcode.sila2_commands import settle

              feature = sila2_client.MicroplateCentrifugeController
              settle(feature.CloseDoor(), "CloseDoor")
              settle(
                  feature.SpinCycle(
                      VelocityPercent=20.0,
                      AccelerationPercent=20.0,
                      DecelerationPercent=20.0,
                      TimerMode=0,
                      Time=30,
                      BucketNumberToLoad=1,
                      BucketNumberToUnload=1,
                      GripperOffsetToLoad=8.0,
                      GripperOffsetToUnload=8.0,
                      PlateHeightToLoad=15.0,
                      PlateHeightToUnload=15.0,
                      SpeedToLoad=1,
                      SpeedToUnload=1,
                      OptionsToLoad=0,
                      OptionsToUnload=0,
                  ),
                  "SpinCycle",
              )
              # Reopened before returning, so the plate can be picked back out.
              settle(feature.OpenDoor(BucketNumber=1), "OpenDoor")

              return {}

objective:
  kind: makespan
