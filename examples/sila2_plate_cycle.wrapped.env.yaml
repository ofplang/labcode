# The labcode environment for sila2_plate_cycle.workflow.yaml, written with `flavor: sila2`
# -- the recommended way to drive a SiLA2 lab (SPECIFICATIONS.md §1.6). Each machine's
# address is declared once, under its `x-labcode.connection`, and each script is the
# commands alone: labcode opens `sila2_client` before the code runs and closes it afterwards.
#
# VERIFIED AGAINST: ofplang-sila2-backend branch `ardea` (commit de3c4fd), the virtual lab of mock
# SiLA2 instrument servers. That lab is a reference, not a requirement: pointing these
# scripts at real instruments is a matter of changing the hosts and ports below. The command
# arguments come from the delivery scripts in `ScriptsForIntegrationTest` (snip_xpeel.py,
# snip_plateloc.py, snip_atc.py, snip_microplate_centrifuge.py), so what each instrument is
# asked to do here is what those scripts ask of the real hardware.
#
# ---------------------------------------------------------------------------------------
# THE ARM NAMES STATIONS; THE WORKFLOW NAMES SPOTS
#
# These are two different vocabularies for the same places, and a transport script is where
# they meet.
#
# labcode addresses a place as `device.spot` -- `plateloc.stage`, `thermal_cycler.block` --
# because that is what a workflow reasons about: which machine holds the Object. The arm
# addresses the same places as **stations**: `Base1`, `Base2`, ... are the machine's own names
# for the positions it can serve, and they are what `Transfer` takes. On the real Ardea those
# names index its motion configuration, which records where each station sits on the rail and
# which robot tasks reach it -- so they are the arm's vocabulary in the strongest sense: it is
# the only thing it can be told.
#
# So each transport script **writes its two station names out literally**. There is nothing to
# derive: `from_spot` and `to_spot` are labcode's names and no rule turns one into the other.
# A route is one fixed pair of places, so there is nothing to compute either. This environment
# uses the bench's map:
#
#     Base1  station.slot1        (a plain plate-holding station)
#     Base3  seal-remover.stage   (the peeler)
#     Base4  plateloc.stage       (the sealer)
#     Base5  centrifuge.deck      (the plate centrifuge)
#     Base6  thermal-cycler.block (the thermal cycler)
#
# (`Base2` is the other plain station; this circuit does not use it.) The lab's own server holds
# the same map, in `ARDEA_STATIONS`, and that is what turns a station name into a place; nothing
# here needs the lab's location strings any more, which is why they no longer appear below.
#
# The cost is that the route above and the names below can drift apart: change a `from:` or
# `to:` and the script has to change with it. The lab is what catches that -- a station name it
# does not know fails with `InvalidStation`, and a move to the wrong real place fails when the
# plate turns out not to be where the next step needs it.
#
# A SECOND, SMALLER MISMATCH: the device ids here are not the lab's device names either.
# v0 identifiers are `[A-Za-z_][A-Za-z0-9_]*` (schedule SPECIFICATIONS §8), so a device id
# cannot contain a hyphen -- but the lab's devices are `seal-remover` and `thermal-cycler`.
# Hence `seal_remover` and `thermal_cycler` below. The lab is not renamed to suit labcode: the
# dependency runs one way, and the lab's world model is not labcode's to edit. This mismatch
# now costs nothing, because no script spells a lab location.
#
# Only transport scripts face any of this, because only they name places: a process script is
# told nothing about where its Object sits, so all four instruments are driven the same way.
#
# ---------------------------------------------------------------------------------------
# WHERE THE LID AND DOOR CHOREOGRAPHY LIVES, AND WHAT THE INSTRUMENTS LOOK LIKE AT REST
#
# In the lab's world model a closed lid or door makes that spot inaccessible, and an item
# cannot be moved into or out of an inaccessible spot. So somebody has to open the thermal
# cycler before the plate arrives, and that somebody is the transport that delivers it: a
# route may declare `endpoints: true` and be handed clients for the devices at either end as
# well as for the arm (SPECIFICATIONS.md §1.6). It is sound because the scheduler has already
# given that move both instruments for its whole duration -- nothing else can be using them.
#
# The convention here is that **an instrument is closed at rest**:
#
#   * a transport opens what it must to pick and to place, and closes the source it emptied;
#   * a process closes the instrument to work, and leaves it closed.
#
# So the plate's arrival at the thermal cycler reads: the transport opens the lid, places the
# plate and (having taken nothing out) leaves it open; `thermal_cycle` closes it, runs, and
# leaves it closed; the next transport opens it, picks the plate out and closes it again.
#
# Closed-at-rest is what a real instrument does, and it is what makes this example *check*
# something rather than merely work: the lab starts with everything open, so the first run's
# `OpenLid` is a no-op -- but every run after it starts with the cycler and the centrifuge
# closed, and gets nowhere unless the transports really can open them. `OpenLid` / `CloseLid`
# set the world's accessibility outright rather than toggling it, so calling one that is
# already true costs nothing.
#
# The one thing to know: the plate is inside a closed instrument for part of the circuit, so a
# run that dies there leaves it there. Getting it out is an operator's job (or a reseed), as
# it is for any run that fails half way.
#
# ---------------------------------------------------------------------------------------
# WHAT THE DURATIONS ARE, AND WHY THEY ARE NOT THE INSTRUMENT'S TIME
#
# A mode's `duration` is what the *scheduler* should expect the operation to take, and an
# operation is more than the instrument's part of it. Measured against the lab's
# `command_durations.realistic.yaml` at `--seconds-per-tick 1.0`, each op costs roughly
#
#     (the profile's command times)  +  ~2 s  +  (client builds)  +  ~1 s per settle
#
# where the fixed part is labcode's own per-op cost (launching the child process), a client
# build is a SiLA2 client fetching every Feature definition the server has, and the per-settle
# part is the poll interval (1 s), since a command that finishes mid-interval is not noticed
# until the next look. All three show here: `thermal_cycle` runs five short commands
# (1+1+4+2+2 s), each losing most of a poll; the three routes that declare `endpoints: true`
# build two or three clients rather than one; and **the arm's own client is the expensive one**
# -- ~1 s buys a single-feature instrument, but Ardea serves nine Feature definitions and
# measured 3-7 s. Every route pays that, which is why a plain move is 40 and not 33.
#
# So the numbers below are the *measured* op times, and each mode and route says where its
# figure comes from. Declaring the instrument's time alone would under-run every op by that
# overhead, and the scheduler would keep trying to dispatch a successor onto a device still
# finishing.
#
# Where a figure is rounded it is rounded **up**, and by a few seconds rather than one: the
# arm's client build varies by 4 s on its own, and dispatching a successor onto an instrument
# that has not finished is the failure worth avoiding. Every route now carries a `Transfer`,
# which the profile gives 30 s -- the arm drives the whole route inside that one command, and it
# is the longest command in the lab -- so the two routes that open nothing are 40 rather than
# the 3 they were when a move was two instant commands, and the whole circuit is a makespan of
# about 260-290 rather than 110. Against the lab's default profile (which waits for nothing)
# every op simply finishes early, and the run still completes -- so this environment works
# against both.
time:
  unit: second

devices:
  # The seal remover. The lab calls it `seal-remover`; see the note above on the renaming.
  - id: seal_remover
    spots: [stage]
    x-labcode:
      # `insecure: true` is currently required: TLS has nowhere in the schema to keep its
      # credentials, so it is refused at the front door (SPECIFICATIONS.md §1.4).
      connection: { kind: sila2, host: 127.0.0.1, port: 50054, insecure: true }

  # The plate sealer.
  - id: plateloc
    spots: [stage]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50053, insecure: true }

  # The thermal cycler. The lab calls it `thermal-cycler`.
  - id: thermal_cycler
    spots: [block]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50055, insecure: true }

  # The centrifuge.
  - id: centrifuge
    spots: [deck]
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50052, insecure: true }

  # A station slot: a plain holding location, used by no process and driven by no script, so
  # it declares no connection. The Plate lives here at the run boundary, and the circuit
  # starts and ends here.
  - { id: station, spots: [slot1] }

transporters:
  # The arm carries the plate between all five locations. It is every transport's first client
  # (`sila2_client`, §1.6) -- the machine that does the moving -- whether or not the route also
  # asks for the instruments at its ends.
  - id: arm
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50057, insecure: true }

transports:
  # Every route is one `Transfer`, which the lab's realistic profile gives 30 s: the arm drives
  # the whole route inside that one command -- carriage to the source, pick, carriage to the
  # destination, put. A move that opens nothing therefore costs the transfer plus labcode's own
  # overhead, and the routes that open something add the instrument's time on top.
  #
  # The overhead is bigger here than for an instrument op, because **building the arm's client
  # is the most expensive client build in the lab**: Ardea serves nine Feature definitions (its
  # own four plus the two providers' five) and a client fetches all of them -- measured 3-7 s
  # against ~1 s for a single-feature instrument. That variance is why these figures sit a few
  # seconds above their measured times rather than one.

  - transporter: arm
    from: station.slot1
    to: seal_remover.stage
    duration: 40
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # `sila2_client` is connected to `arm`; from_spot / to_spot / transporter are the
          # physical route and `view` is the moved Plate's view. Side-effect only.
          #
          # A transfer is ONE command -- the machine drives the whole route -- but it is
          # OBSERVABLE, so polling it to completion is not optional: without `settle` this
          # script would report success while the plate is still in the air.
          #
          # The station names are the machine's own, written out (see the header): this route
          # is labcode's station.slot1 -> seal_remover.stage, which the arm calls Base1 -> Base3.
          #
          # The response (CarriagePosition, AtRetractPose) is dropped: this is a side-effect
          # script, and an arm that failed to reach its retract pose raises PoseNotRestored
          # rather than returning False.
          from labcode.sila2_commands import settle

          labware = sila2_client.LabwareService
          settle(labware.Transfer(SourceStation="Base1", DestinationStation="Base3"), "Transfer")

  - transporter: arm
    from: seal_remover.stage
    to: plateloc.stage
    duration: 40
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # labcode's seal_remover.stage -> plateloc.stage = the arm's Base3 -> Base4.
          from labcode.sila2_commands import settle

          labware = sila2_client.LabwareService
          settle(labware.Transfer(SourceStation="Base3", DestinationStation="Base4"), "Transfer")

  - transporter: arm
    from: plateloc.stage
    to: thermal_cycler.block
    # Transfer 30 + OpenLid 4, two settles, and a second client to build: measured 38-41.
    duration: 43
    x-labcode:
      script:
        flavor: sila2
        language: python
        # The first route that has to touch an instrument: the cycler is closed at rest, and
        # a plate cannot be placed into a closed one.
        endpoints: true
        code: |
          # labcode's plateloc.stage -> thermal_cycler.block = the arm's Base4 -> Base6.
          #
          # `sila2_clients` holds the arm and both ends of the route, by device id. The
          # sealer end is not commanded here -- an emptied stage needs no closing -- so only
          # the cycler is looked up. It is left open on purpose: `thermal_cycle` is what
          # closes it, having a plate to close it on.
          from labcode.sila2_commands import settle

          cycler = sila2_clients["thermal_cycler"].AutomatedThermalCyclerController
          settle(cycler.OpenLid(), "OpenLid")

          labware = sila2_client.LabwareService
          settle(labware.Transfer(SourceStation="Base4", DestinationStation="Base6"), "Transfer")

  - transporter: arm
    from: thermal_cycler.block
    to: centrifuge.deck
    # The most expensive move: Transfer 30 + OpenLid 4 + OpenDoor 3 + CloseLid 4, four settles,
    # and three clients to build. Measured 46-48.
    duration: 51
    x-labcode:
      script:
        flavor: sila2
        language: python
        # The only leg with an instrument to open at *both* ends.
        endpoints: true
        code: |
          # labcode's thermal_cycler.block -> centrifuge.deck = the arm's Base6 -> Base5.
          #
          # Both ends are opened before anything moves, rather than opening the destination
          # once the plate is already on the arm: if the centrifuge will not open, the plate
          # is better still in the cycler than held.
          #
          # `BucketNumber=1` is the bucket `rotate` loads and unloads (snip_microplate_
          # centrifuge.py's value), so it is the one the plate has to go into.
          from labcode.sila2_commands import settle

          cycler = sila2_clients["thermal_cycler"].AutomatedThermalCyclerController
          centrifuge = sila2_clients["centrifuge"].MicroplateCentrifugeController
          settle(cycler.OpenLid(), "OpenLid")
          settle(centrifuge.OpenDoor(BucketNumber=1), "OpenDoor")

          labware = sila2_client.LabwareService
          settle(labware.Transfer(SourceStation="Base6", DestinationStation="Base5"), "Transfer")

          # The cycler is empty now, so it is closed again: closed is how an instrument is
          # left at rest here. The centrifuge stays open until `rotate` closes it on the plate.
          settle(cycler.CloseLid(), "CloseLid")

  - transporter: arm
    from: centrifuge.deck
    to: station.slot1
    # Transfer 30 + OpenDoor 3 + CloseDoor 3, three settles, and a second client: measured 40-43.
    duration: 45
    x-labcode:
      script:
        flavor: sila2
        language: python
        # The centrifuge has to be opened to get the plate back out.
        endpoints: true
        code: |
          # labcode's centrifuge.deck -> station.slot1 = the arm's Base5 -> Base1: the closing
          # leg, so the Plate ends where it started and the run can be repeated without an
          # operator putting the world back.
          #
          # `station` declares no connection -- it is a shelf, not an instrument -- so it has
          # no client here even though the route holds it. Reaching for one would say so
          # rather than fail obscurely (§1.6). The arm still reaches it: Base1 is a station of
          # the machine like any other, and needing no client is not the same as needing no
          # station name.
          from labcode.sila2_commands import settle

          centrifuge = sila2_clients["centrifuge"].MicroplateCentrifugeController
          settle(centrifuge.OpenDoor(BucketNumber=1), "OpenDoor")

          labware = sila2_client.LabwareService
          settle(labware.Transfer(SourceStation="Base5", DestinationStation="Base1"), "Transfer")

          # Emptied, so closed: the world is left as the next run expects to find it.
          settle(centrifuge.CloseDoor(), "CloseDoor")

processes:

  peel:
    modes:
      - devices: [seal_remover]
        # Peel 8 + GetTapeLeft 0, plus ~2 settles' worth of poll and the per-op overhead.
        duration: 12
        input_spots:  { plate: seal_remover.stage }
        output_spots: { plate: seal_remover.stage }   # unsealed in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # `sila2_client` is connected to `seal_remover` -- the mode's only device.
              # `plate` is the incoming Plate's view; the Plate itself is carried through by
              # objects.map, so this script returns only what it reads (§1.2).
              #
              # Peel is an OBSERVABLE command: the call returns a command instance
              # immediately and the work happens on the server, so polling it to completion
              # is not optional. `settle` is that polling loop, shipped by labcode (§1.6.1)
              # and reached by an ordinary import: the flavor injects connections and nothing
              # else, so what this script depends on is written in it.
              #
              # Arguments are the delivery script's: snip_xpeel.py calls `Peel(4, 1)`
              # -- begin at the default location peeling slowly, with the shortest adhesion
              # time.
              from labcode.sila2_commands import settle

              feature = sila2_client.AutomatedPlateSealRemoverController
              # Peel needs a plate present at this server's location; if the transport before
              # it did not actually deliver one, this is where that surfaces.
              settle(feature.Peel(BeginPeelLocation=4, AdhesionTime=1), "Peel")
              tape = settle(feature.GetTapeLeft(), "GetTapeLeft")

              return {"tape_left": int(tape.SupplySpoolRemaining)}

  seal:
    modes:
      - devices: [plateloc]
        # SetSealingTemperature and SetSealingTime wait for nothing; StartCycle is 15 s.
        # One settle only, so this is the mode whose figure is closest to the instrument's.
        duration: 18
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # The sealing parameters are set on the instrument first and the cycle then runs
              # on whatever plate is present, which is why this reads as three calls rather
              # than one. 150 °C and 3 s are the delivery script's values
              # (snip_plateloc.py); both are unobservable commands, so neither is polled.
              #
              # CycleCount is a property, not a command: reading it needs no polling. It is
              # read after the cycle so the number reflects the one this run performed.
              #
              # Note which calls are settled and which are not: SetSealingTemperature and
              # SetSealingTime are UNOBSERVABLE, so they have finished when they return and
              # settling one would be an error (`sila2_not_observable`).
              from labcode.sila2_commands import settle

              feature = sila2_client.PlateLocController
              feature.SetSealingTemperature(SealingTemperature=150)
              feature.SetSealingTime(SealingTime=3.0)
              settle(feature.StartCycle(), "StartCycle")
              cycles = feature.CycleCount.get()

              return {"cycle_count": int(cycles)}

  thermal_cycle:
    modes:
      - devices: [thermal_cycler]
        # Load 1 + Validate 1 + CloseLid 4 + StartRun 2 + StopRun 2 = 10 s of instrument
        # time, but five settles of five short commands: the poll dominates here. Measured 17.
        duration: 17
        input_spots:  { plate: thermal_cycler.block }
        output_spots: { plate: thermal_cycler.block }   # cycled in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # This script closes the lid and leaves it closed: closed is how an instrument
              # is left at rest here, and the transport that comes for the plate is what
              # opens it (see the top of this file). It receives the cycler already open,
              # because the transport that delivered the plate opened it.
              #
              # The instrument rejects StartRun unless a protocol was loaded and validated, so
              # both precede it. `MaxSampleVolume=0` is the delivery script's value
              # (snip_atc.py calls `Validate(0)`); the Feature defines 0 as "use the
              # instrument's default".
              #
              # StartRun returns while the instrument keeps running -- per the Feature
              # contract the status stays Running until StopRun -- so StopRun is what actually
              # ends the run. ElapsedTime is read after it, which is when the instrument
              # reports how long the run took; before StopRun it is still zero.
              from labcode.sila2_commands import settle

              feature = sila2_client.AutomatedThermalCyclerController
              # A real protocol file would be read from disk here; the delivery script loads
              # ATCTestProtocol.xml. What matters to the workflow is that a protocol is loaded
              # and validated before the run, not what is in it.
              settle(feature.Load(ProtocolFileData=b"mock protocol"), "Load")
              settle(feature.Validate(MaxSampleVolume=0.0), "Validate")

              settle(feature.CloseLid(), "CloseLid")
              settle(feature.StartRun(), "StartRun")
              settle(feature.StopRun(), "StopRun")
              elapsed = feature.ElapsedTime.get()

              return {"elapsed_time": str(elapsed)}

  rotate:
    modes:
      - devices: [centrifuge]
        # CloseDoor 3 + SpinCycle 20, plus two settles and the per-op cost: measured 26-27,
        # declared 27 -- the longest step, and the one the makespan turns on.
        duration: 27
        input_spots:  { plate: centrifuge.deck }
        output_spots: { plate: centrifuge.deck }   # spun in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # As with the thermal cycler's lid: the door arrives open (the transport that
              # delivered the plate opened it), this closes it to spin, and it is left closed
              # for the transport that comes for the plate to open.
              #
              # SpinCycle's fifteen arguments are the delivery script's
              # (snip_microplate_centrifuge.py): 20 % velocity/acceleration/deceleration,
              # TimerMode 0 (the Time below is the total, including ramp-up and ramp-down),
              # 30 seconds, bucket 1 for both load and unload, and the default gripper
              # offsets, plate heights, speeds and options.
              #
              # The centrifuge exposes no counter or measurement, so this script returns
              # nothing -- the Plate is carried through by objects.map.
              from labcode.sila2_commands import settle

              feature = sila2_client.MicroplateCentrifugeController
              settle(feature.CloseDoor(), "CloseDoor")
              settle(
                  feature.SpinCycle(
                      VelocityPercent=20.0,
                      AccelerationPercent=20.0,
                      DecelerationPercent=20.0,
                      TimerMode=0,
                      Time=30,
                      BucketNumberToLoad=1,
                      BucketNumberToUnload=1,
                      GripperOffsetToLoad=8.0,
                      GripperOffsetToUnload=8.0,
                      PlateHeightToLoad=15.0,
                      PlateHeightToUnload=15.0,
                      SpeedToLoad=1,
                      SpeedToUnload=1,
                      OptionsToLoad=0,
                      OptionsToUnload=0,
                  ),
                  "SpinCycle",
              )

              return {}

objective:
  kind: makespan
