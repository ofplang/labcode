# The labcode environment for sila2_seal.workflow.yaml: it says *how* each step is carried
# out, and unlike plate_line's mock scripts these scripts drive REAL SiLA2 servers.
#
# VERIFIED AGAINST: ofplang-sila2-backend branch `ardea` (commit de3c4fd), the virtual lab of mock
# SiLA2 instrument servers. That lab is a *reference*, not a requirement: these scripts speak
# plain SiLA2, so pointing them at real instruments is a matter of changing the host and port
# below. The version is recorded so a run without hardware has something known to be
# reproduced against.
#
# THE ARM NAMES STATIONS; THIS FILE NAMES SPOTS. A transport script cannot pass `from_spot` /
# `to_spot` through to the arm: labcode addresses a place as `device.spot`, while the arm
# addresses it as one of its own **stations** (`Base1`, `Base4`, ...), which is what `Transfer`
# takes. Two vocabularies for the same places, and no rule turns one into the other -- so each
# route writes its station names out literally, and the names in `from:` / `to:` below are
# labcode's own. A station name the arm does not know fails with `InvalidStation`, at the moment
# of use, which is where a wrong assumption about the physical layout belongs.
#
# WHY plateloc AND NOT THE OTHER INSTRUMENTS. v0 identifiers are `[A-Za-z_][A-Za-z0-9_]*`
# (SPECIFICATION 2.4), so a device id cannot contain a hyphen. Of the reference lab's
# instruments only `centrifuge`, `plateloc` and `station` have hyphen-free names, so
# `seal-remover` and `thermal-cycler` would have to be renamed to be named at all (which
# `sila2_plate_cycle.wrapped.env.yaml` does). The arm never comes up: labcode names the
# transporter `arm`, and the places it moves between are named by station now, not by spot.
#
# Durations are chosen to match the lab's `command_durations.realistic.yaml` at
# `--seconds-per-tick 1.0`, so the run neither over- nor under-runs badly against that profile.
# Against the lab's default profile (which waits for nothing) every op simply finishes early,
# and the run still completes -- so this environment works against both.
time:
  unit: second

devices:
  # The plate sealer, whose `stage` holds one plate at a time.
  - { id: plateloc, spots: [stage] }
  # A station slot: a plain holding location, used by no process. The Plate lives here at the
  # run boundary and the arm ferries it to the instrument and back.
  - { id: station,  spots: [slot1] }

transporters:
  - { id: arm }

transports:
  - transporter: arm
    from: station.slot1
    to: plateloc.stage
    # One `Transfer`, which the lab's realistic profile gives 30 s -- the arm drives the whole
    # route inside that one command -- plus labcode's per-op overhead, one poll for `settle`, and
    # the arm's client build (3-7 s: Ardea serves nine Feature definitions and a client fetches
    # all of them). Measured 32-40 across runs; declared 40.
    duration: 40
    x-labcode:
      script:
        language: python
        code: |
          # from_spot / to_spot / transporter are the physical route; `view` is the moved
          # Plate's view (this Plate has no view fields). Side-effect only -- no return.
          #
          # A transfer is ONE SiLA2 command -- the machine drives the whole route -- but it is
          # OBSERVABLE, so polling it to completion is not optional: without `settle` this
          # script would report success while the plate is still in the air.
          #
          # This `settle` is the one labcode ships, imported. The seal script below writes the
          # same loop out by hand instead -- deliberately, since this file is the low-level
          # reference and the loop is worth being able to read. Having both here is the point
          # of §1.6.1: the helper is an ordinary import, equally available to a `raw` script
          # and a `flavor: sila2` one, so which you use is a matter of taste and not of flavor.
          #
          # THE STATION NAMES ARE WRITTEN OUT, not passed through from `from_spot` / `to_spot`.
          # The arm addresses places as its own stations (`Base1`, `Base4`, ...); labcode
          # addresses them as `device.spot`. Two vocabularies for the same places, and no rule
          # turns one into the other. Here: station.slot1 -> plateloc.stage is Base1 -> Base4.
          from labcode.sila2_commands import settle
          from sila2.client import SilaClient

          with SilaClient("127.0.0.1", 50057, insecure=True) as client:
              labware = client.LabwareService
              settle(labware.Transfer(SourceStation="Base1", DestinationStation="Base4"), "Transfer")

  - transporter: arm
    from: plateloc.stage
    to: station.slot1
    duration: 40
    x-labcode:
      script:
        language: python
        code: |
          # The return leg (Base4 -> Base1), so the Plate ends where it started and the run can
          # be repeated without an operator putting the world back.
          from labcode.sila2_commands import settle
          from sila2.client import SilaClient

          with SilaClient("127.0.0.1", 50057, insecure=True) as client:
              labware = client.LabwareService
              settle(labware.Transfer(SourceStation="Base4", DestinationStation="Base1"), "Transfer")

processes:

  seal:
    modes:
      - devices: [plateloc]
        # Matches the lab's realistic StartCycle (15 s) at --seconds-per-tick 1.0.
        duration: 15
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            language: python
            code: |
              # `plate` is the incoming Plate's view; the Plate itself is carried through by
              # objects.map, so this script returns only what it measures -- labcode's partial
              # outputs (SPECIFICATIONS.md §1.2).
              #
              # StartCycle is an OBSERVABLE command: the call returns a command instance
              # immediately and the work happens on the server. Polling that instance to
              # completion is therefore not optional -- without it this script would report
              # success while the instrument is still sealing. The wait is written out here
              # rather than hidden in a helper, so the standard sila2 pattern stays visible in
              # the script that depends on it.
              #
              # CycleCount is a property, not a command: reading it needs no polling. It is read
              # after the cycle so the number reflects the one this run performed.
              #
              # THIS `settle` IS DELIBERATELY HAND-WRITTEN. labcode ships one --
              # `from labcode.sila2_commands import settle` -- and this script could use it:
              # the helper is an ordinary import, available to `raw` and `sila2` alike, which
              # is exactly why it is not a reason to prefer one flavor over the other. It
              # stays spelled out here because this file is the low-level reference, and the
              # loop it replaces is worth being able to read.
              import time

              from sila2.client import SilaClient

              def settle(instance, label, timeout=120.0):
                  deadline = time.monotonic() + timeout
                  while not instance.done:
                      if time.monotonic() > deadline:
                          raise TimeoutError(f"{label} did not finish within {timeout:.0f}s")
                      time.sleep(0.1)
                  return instance.get_responses()

              with SilaClient("127.0.0.1", 50053, insecure=True) as client:
                  feature = client.PlateLocController
                  # StartCycle needs a plate present at this server's location; if the transport
                  # above did not actually deliver one, this is where that surfaces.
                  settle(feature.StartCycle(), "StartCycle")
                  cycles = feature.CycleCount.get()

              return {"cycle_count": int(cycles)}
