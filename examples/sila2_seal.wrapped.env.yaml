# The labcode environment for sila2_seal.workflow.yaml, written with `flavor: sila2` -- the
# recommended way to drive a SiLA2 lab (SPECIFICATIONS.md §1.6).
#
# HOW IT DIFFERS FROM sila2_seal.env.yaml. That one is `raw`: each script opens its own
# `SilaClient`, so the address appears in every script that talks to a machine. Here the
# address is declared once per machine, under the device's (or the transporter's)
# `x-labcode.connection`, and each script is the *commands alone* -- labcode opens
# `sila2_client` before the code runs and closes it afterwards, on any exit.
#
# The two environments drive the same workflow through the same physical motions and are
# interchangeable (`run_sila2_seal.py --env ...` takes either), but they are not promised to
# stay equivalent: this one is the example that follows the dialect, and the raw one stays as
# the low-level reference.
#
# VERIFIED AGAINST: ofplang-sila2-backend v0.3.0 (commit 0c3c4c8), the virtual lab of mock
# SiLA2 instrument servers. That lab is a reference, not a requirement: pointing these
# scripts at real instruments is a matter of changing the hosts and ports below -- and here
# they are in one place per machine rather than inside the scripts.
#
# WHAT THE FLAVOR DOES NOT DO: it supplies connections, nothing else. Waiting for an
# observable command to finish is still the script's own business (see `settle` below), and
# the spot names still have to be the ones the lab declares -- a name it does not know fails
# the move with `unknown_location`, at the moment of use.
time:
  unit: second

devices:
  # The plate sealer. Its address is declared here, once, instead of in the seal script.
  - id: plateloc
    spots: [stage]
    x-labcode:
      # `insecure: true` is currently required: TLS has nowhere in the schema to keep its
      # credentials, so it is refused at the front door (SPECIFICATIONS.md §1.4).
      connection: { kind: sila2, host: 127.0.0.1, port: 50053, insecure: true }

  # A station slot: a plain holding location, used by no process and driven by no script, so
  # it declares no connection. The Plate lives here at the run boundary.
  - { id: station, spots: [slot1] }

transporters:
  # The arm carries the plate. A transport script's client comes from the transporter, not
  # from the spots it moves between.
  - id: arm
    x-labcode:
      connection: { kind: sila2, host: 127.0.0.1, port: 50057, insecure: true }

transports:
  - transporter: arm
    from: station.slot1
    to: plateloc.stage
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # `sila2_client` is connected to `arm`; from_spot / to_spot / transporter are the
          # physical route and `view` is the moved Plate's view. Side-effect only.
          #
          # A transfer is two commands, not one: Pick takes the plate onto the arm and Place
          # puts it down. Both are unobservable, so they have completed by the time the call
          # returns and there is nothing to poll.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier=from_spot)
          arm.Place(LocationSpecifier=to_spot)

  - transporter: arm
    from: plateloc.stage
    to: station.slot1
    duration: 3
    x-labcode:
      script:
        flavor: sila2
        language: python
        code: |
          # The return leg, so the Plate ends where it started and the run can be repeated
          # without an operator putting the world back.
          arm = sila2_client.TrolleyArmProvider
          arm.Pick(LocationSpecifier=from_spot)
          arm.Place(LocationSpecifier=to_spot)

processes:

  seal:
    modes:
      - devices: [plateloc]
        # Matches the lab's realistic StartCycle (15 s) at --seconds-per-tick 1.0.
        duration: 15
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            flavor: sila2
            language: python
            code: |
              # `sila2_client` is connected to `plateloc` -- the mode's only device. `plate`
              # is the incoming Plate's view; the Plate itself is carried through by
              # objects.map, so this script returns only what it measures (§1.2).
              #
              # StartCycle is an OBSERVABLE command: the call returns a command instance
              # immediately and the work happens on the server. Polling that instance to
              # completion is not optional -- without it this script would report success
              # while the instrument is still sealing. `settle` is that polling loop, shipped
              # by labcode (§1.6.1) and reached by an ordinary import -- the flavor injects
              # connections and nothing else, so the dependency stays visible right here.
              #
              # CycleCount is a property, not a command: reading it needs no polling. It is
              # read after the cycle so the number reflects the one this run performed.
              from labcode.sila2_commands import settle

              feature = sila2_client.PlateLocController
              # StartCycle needs a plate present at this server's location; if the transport
              # above did not actually deliver one, this is where that surfaces.
              settle(feature.StartCycle(), "StartCycle")
              cycles = feature.CycleCount.get()

              return {"cycle_count": int(cycles)}

objective:
  kind: makespan
