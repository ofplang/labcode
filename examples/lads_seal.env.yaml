# The labcode environment for sila2_seal.workflow.yaml, written with `flavor: lads` -- the same
# workflow and the same physical motions as sila2_seal.wrapped.env.yaml, with every machine
# reached over LADS OPC UA instead of SiLA2 (SPECIFICATIONS.md §1.10).
#
# THE WORKFLOW DOES NOT CHANGE. Which protocol reaches a machine is a property of the lab, so it
# lives here, in the environment: the workflow and its boundary are sila2_seal's own, unedited,
# and `run_sila2_seal.py --env lads_seal.env.yaml` checks this run with the same checks.
#
# HOW IT DIFFERS FROM THE SILA2 ONE. Each connection says `kind: lads`, and each script is handed
# `lads_client` -- one LADS functional unit, already connected -- where the other is handed a
# SiLA2 client. A SiLA2 command becomes what LADS offers for it: a command that does the work is
# a *program* (`run_program`, which returns once the run has recorded its result), a setter is a
# control function's `TargetValue`, and a value LADS has no node for (`CycleCount`) is a
# variable the server adds under the unit. Nothing has to be polled by hand: the unit's calls
# wait for what they start.
#
# VERIFIED AGAINST: ofplang-mocklab (profile `lads`), the virtual lab of mock instruments, whose
# LADS servers share their behaviour with the SiLA2 ones. The ports below are mocklab's defaults.
# The `device` / `unit` of each connection are left out: each of mocklab's servers holds one
# device of one functional unit, so there is nothing to choose (§1.5). Where the lab's LADS
# servers differ from its SiLA2 ones, mocklab's docs/LADS_MAPPING.md says how.
time:
  unit: second

devices:
  # The plate sealer: mocklab's `PlateLoc` device, unit `Sealer`.
  - id: plateloc
    spots: [stage]
    x-labcode:
      # `insecure: true` is required: an OPC UA security mode other than None has nowhere in
      # the schema to keep its certificates, so it is refused at the front door (§1.5).
      connection: { kind: lads, host: 127.0.0.1, port: 4842, insecure: true }

  # A station slot: a plain holding location, used by no process and driven by no script, so
  # it declares no connection. The Plate lives here at the run boundary.
  - { id: station, spots: [slot1] }

transporters:
  # The arm: mocklab's `Ardea` device, unit `Transporter`. A transport script's client comes from
  # the transporter, not from the spots it moves between.
  - id: arm
    x-labcode:
      connection: { kind: lads, host: 127.0.0.1, port: 4847, insecure: true }

transports:
  # Each leg is one `Transfer` program, which the lab's realistic profile gives 30 s: the arm
  # drives the whole route inside that one run. Declared as the SiLA2 environment declares it.
  - transporter: arm
    from: station.slot1
    to: plateloc.stage
    duration: 40
    x-labcode:
      script:
        flavor: lads
        language: python
        code: |
          # `lads_client` is the arm's functional unit. `run_program` starts the Transfer and
          # returns once its result is recorded -- which is when the plate has arrived -- and
          # fails the operation if the run did not complete (an unknown station, say).
          #
          # THE STATION NAMES ARE WRITTEN OUT, as in the SiLA2 environment: the arm addresses
          # places as its own stations, labcode as `device.spot`, and no rule turns one into the
          # other. Here: labcode's station.slot1 -> plateloc.stage is the arm's Base1 -> Base4.
          lads_client.run_program("Transfer", SourceStation="Base1", DestinationStation="Base4")

  - transporter: arm
    from: plateloc.stage
    to: station.slot1
    duration: 40
    x-labcode:
      script:
        flavor: lads
        language: python
        code: |
          # The return leg (the arm's Base4 -> Base1), so the Plate ends where it started and
          # the run can be repeated without an operator putting the world back.
          lads_client.run_program("Transfer", SourceStation="Base4", DestinationStation="Base1")

processes:

  seal:
    modes:
      - devices: [plateloc]
        # Matches the lab's realistic StartCycle (15 s) at --seconds-per-tick 1.0.
        duration: 15
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            flavor: lads
            language: python
            code: |
              # `lads_client` is the sealer's functional unit. StartCycle is a program: the
              # call returns once the run's result is recorded, and by then the server has
              # counted the cycle, so CycleCount read afterwards includes this run's.
              #
              # CycleCount is not a LADS node -- LADS defines no counter -- but a variable the
              # server adds under the unit, read by its browse name like any other node.
              lads_client.run_program("StartCycle")
              return {"cycle_count": int(lads_client.read("CycleCount"))}
