# The labcode environment for sila2_plate_cycle.workflow.yaml, written with `flavor: lads` --
# the same circuit through the same four instruments and the arm as
# sila2_plate_cycle.wrapped.env.yaml, with every machine reached over LADS OPC UA instead of
# SiLA2 (SPECIFICATIONS.md §1.10).
#
# THE WORKFLOW DOES NOT CHANGE. Which protocol reaches a machine is a property of the lab, so it
# lives here: the workflow and its boundary are sila2_plate_cycle's own, unedited, and
# `run_sila2_plate_cycle.py --env lads_plate_cycle.env.yaml` checks this run with the same
# checks.
#
# The SiLA2 environment's header explains what this one shares with it and does not repeat
# here: why the arm's station names are written out in each route, why the device ids are not
# the lab's names, the closed-at-rest convention for the cycler's lid and the centrifuge's door
# (and so which route opens and closes what), and what the durations measure. The durations are
# the SiLA2 environment's, since the instruments' time is the same; building a LADS client is
# cheaper than building the arm's SiLA2 one, so these err on the long side.
#
# WHAT CHANGES IS HOW EACH COMMAND IS SAID. mocklab's docs/LADS_MAPPING.md is the full table; the
# ones this circuit uses:
#
#     SiLA2                                   LADS (on the unit a script is handed)
#     an observable command (Peel, ...)       run_program("<command>", <arguments>) -- returns
#                                             once the run's result is recorded
#     OpenLid / CloseLid, OpenDoor / ...      cover("Lid" | "Door", "Open" | "Close") -- returns
#                                             once the cover has settled Opened / Closed
#     SetSealingTemperature / SetSealingTime  write_target("SealingTemperature" | "SealingTime")
#                                             -- the time in MILLISECONDS (an OPC UA Duration)
#     StopRun                                 stop() -- returns once the unit has settled
#     GetTapeLeft                             FunctionSet/SupplySpool's SensorValue
#     CycleCount, ElapsedTime                 variables the server adds under the unit
#
# Two differences are LADS's own and show in the scripts below: a program's arguments travel as
# strings (so the cycler's protocol file is text, not bytes), and a unit takes a new program only
# while it is Stopped -- which is why the cycler's run is stopped before its script ends.
#
# VERIFIED AGAINST: ofplang-mocklab (profile `lads`), whose LADS servers share their behaviour
# with its SiLA2 ones; the ports below are mocklab's defaults. No connection names a `device` or
# `unit`: each server holds one device of one functional unit, so there is nothing to choose
# (§1.5).
time:
  unit: second

devices:
  # The seal remover: mocklab's `SealRemover` device, unit `Peeler`.
  - id: seal_remover
    spots: [stage]
    x-labcode:
      # `insecure: true` is required: an OPC UA security mode other than None has nowhere in
      # the schema to keep its certificates, so it is refused at the front door (§1.5).
      connection: { kind: lads, host: 127.0.0.1, port: 4843, insecure: true }

  # The plate sealer: `PlateLoc` / `Sealer`.
  - id: plateloc
    spots: [stage]
    x-labcode:
      connection: { kind: lads, host: 127.0.0.1, port: 4842, insecure: true }

  # The thermal cycler: `ThermalCycler` / `Cycler`.
  - id: thermal_cycler
    spots: [block]
    x-labcode:
      connection: { kind: lads, host: 127.0.0.1, port: 4844, insecure: true }

  # The centrifuge: `Centrifuge` / `Centrifuge`.
  - id: centrifuge
    spots: [deck]
    x-labcode:
      connection: { kind: lads, host: 127.0.0.1, port: 4841, insecure: true }

  # A station slot: a plain holding location with no connection. The Plate lives here at the
  # run boundary, and the circuit starts and ends here.
  - { id: station, spots: [slot1] }

transporters:
  # The arm: `Ardea` / `Transporter`. It is every transport's first client (`lads_client`) --
  # the machine that does the moving -- whether or not the route also asks for its ends.
  - id: arm
    x-labcode:
      connection: { kind: lads, host: 127.0.0.1, port: 4847, insecure: true }

transports:
  - transporter: arm
    from: station.slot1
    to: seal_remover.stage
    duration: 40
    x-labcode:
      script:
        flavor: lads
        language: python
        code: |
          # labcode's station.slot1 -> seal_remover.stage = the arm's Base1 -> Base3. The
          # Transfer's result (CarriagePosition, AtRetractPose) is dropped: this is a
          # side-effect script, and a run that did not complete fails the operation.
          lads_client.run_program("Transfer", SourceStation="Base1", DestinationStation="Base3")

  - transporter: arm
    from: seal_remover.stage
    to: plateloc.stage
    duration: 40
    x-labcode:
      script:
        flavor: lads
        language: python
        code: |
          # labcode's seal_remover.stage -> plateloc.stage = the arm's Base3 -> Base4.
          lads_client.run_program("Transfer", SourceStation="Base3", DestinationStation="Base4")

  - transporter: arm
    from: plateloc.stage
    to: thermal_cycler.block
    duration: 43
    x-labcode:
      script:
        flavor: lads
        language: python
        # The cycler is closed at rest, and a plate cannot be placed into a closed one.
        endpoints: true
        code: |
          # labcode's plateloc.stage -> thermal_cycler.block = the arm's Base4 -> Base6.
          #
          # `lads_clients` holds the arm and both ends of the route, by device id. The lid is
          # left open on purpose: `thermal_cycle` is what closes it, having a plate to close
          # it on.
          lads_clients["thermal_cycler"].cover("Lid", "Open")
          lads_client.run_program("Transfer", SourceStation="Base4", DestinationStation="Base6")

  - transporter: arm
    from: thermal_cycler.block
    to: centrifuge.deck
    duration: 51
    x-labcode:
      script:
        flavor: lads
        language: python
        # The only leg with an instrument to open at *both* ends.
        endpoints: true
        code: |
          # labcode's thermal_cycler.block -> centrifuge.deck = the arm's Base6 -> Base5.
          #
          # Both ends are opened before anything moves: if the centrifuge will not open, the
          # plate is better still in the cycler than held. LADS's Cover.Open takes no
          # arguments, so there is no bucket to name; mocklab opens bucket 1, the one `rotate`
          # loads and unloads.
          cycler = lads_clients["thermal_cycler"]
          centrifuge = lads_clients["centrifuge"]
          cycler.cover("Lid", "Open")
          centrifuge.cover("Door", "Open")

          lads_client.run_program("Transfer", SourceStation="Base6", DestinationStation="Base5")

          # The cycler is empty now, so it is closed again. The centrifuge stays open until
          # `rotate` closes it on the plate.
          cycler.cover("Lid", "Close")

  - transporter: arm
    from: centrifuge.deck
    to: station.slot1
    duration: 45
    x-labcode:
      script:
        flavor: lads
        language: python
        # The centrifuge has to be opened to get the plate back out.
        endpoints: true
        code: |
          # labcode's centrifuge.deck -> station.slot1 = the arm's Base5 -> Base1: the closing
          # leg, so the Plate ends where it started. `station` declares no connection, so it
          # has no unit here even though the route holds it.
          centrifuge = lads_clients["centrifuge"]
          centrifuge.cover("Door", "Open")

          lads_client.run_program("Transfer", SourceStation="Base5", DestinationStation="Base1")

          # Emptied, so closed: the world is left as the next run expects to find it.
          centrifuge.cover("Door", "Close")

processes:

  peel:
    modes:
      - devices: [seal_remover]
        duration: 12
        input_spots:  { plate: seal_remover.stage }
        output_spots: { plate: seal_remover.stage }   # unsealed in place
        x-labcode:
          script:
            flavor: lads
            language: python
            code: |
              # Peel is a program; its arguments are the delivery script's (snip_xpeel.py's
              # `Peel(4, 1)`). What is left of the tape is not in Peel's result but on the
              # SupplySpool sensor function, which the server updates as the run ends.
              lads_client.run_program("Peel", BeginPeelLocation=4, AdhesionTime=1)
              tape = lads_client.read("FunctionSet/SupplySpool/SensorValue")

              return {"tape_left": int(tape)}

  seal:
    modes:
      - devices: [plateloc]
        duration: 18
        input_spots:  { plate: plateloc.stage }
        output_spots: { plate: plateloc.stage }   # sealed in place
        x-labcode:
          script:
            flavor: lads
            language: python
            code: |
              # The sealing parameters are set first and the cycle then runs on whatever plate
              # is present. 150 °C and 3 s are the delivery script's values (snip_plateloc.py);
              # the time is written in milliseconds, since a LADS timer function's TargetValue
              # is an OPC UA Duration. A value the instrument refuses fails the write, and so
              # the operation.
              lads_client.write_target("SealingTemperature", 150)
              lads_client.write_target("SealingTime", 3000)
              lads_client.run_program("StartCycle")

              return {"cycle_count": int(lads_client.read("CycleCount"))}

  thermal_cycle:
    modes:
      - devices: [thermal_cycler]
        duration: 17
        input_spots:  { plate: thermal_cycler.block }
        output_spots: { plate: thermal_cycler.block }   # cycled in place
        x-labcode:
          script:
            flavor: lads
            language: python
            code: |
              # This script receives the cycler open (the transport that delivered the plate
              # opened it), closes the lid, and leaves it closed for the transport that comes
              # for the plate.
              #
              # The instrument rejects StartRun unless a protocol was loaded and validated, so
              # both precede it. A program's arguments are strings, so the protocol file is
              # text here; the server hands it to the instrument as UTF-8 bytes.
              cycler = lads_client
              cycler.run_program("Load", ProtocolFileData="mock protocol")
              cycler.run_program("Validate", MaxSampleVolume=0.0)

              cycler.cover("Lid", "Close")
              # StartRun completes as a program while the instrument keeps running -- the unit
              # stays Running until it is stopped, as the SiLA2 status stays Running until
              # StopRun. `stop()` is StopRun, and it has to happen here: a LADS unit takes no
              # new program until it is Stopped again.
              cycler.run_program("StartRun")
              cycler.stop()

              return {"elapsed_time": str(cycler.read("ElapsedTime"))}

  rotate:
    modes:
      - devices: [centrifuge]
        duration: 27
        input_spots:  { plate: centrifuge.deck }
        output_spots: { plate: centrifuge.deck }   # spun in place
        x-labcode:
          script:
            flavor: lads
            language: python
            code: |
              # The door arrives open, this closes it to spin, and it is left closed for the
              # transport that comes for the plate to open. SpinCycle's fifteen properties are
              # the delivery script's (snip_microplate_centrifuge.py), and all of them are
              # required, as the SiLA2 command's arguments are.
              centrifuge = lads_client
              centrifuge.cover("Door", "Close")
              centrifuge.run_program(
                  "SpinCycle",
                  VelocityPercent=20.0,
                  AccelerationPercent=20.0,
                  DecelerationPercent=20.0,
                  TimerMode=0,
                  Time=30,
                  BucketNumberToLoad=1,
                  BucketNumberToUnload=1,
                  GripperOffsetToLoad=8.0,
                  GripperOffsetToUnload=8.0,
                  PlateHeightToLoad=15.0,
                  PlateHeightToUnload=15.0,
                  SpeedToLoad=1,
                  SpeedToUnload=1,
                  OptionsToLoad=0,
                  OptionsToUnload=0,
              )

              return {}
